_base_: ../defaults.yaml
project:
  name: oncoderm_mambax_submission_v1
  output_dir: outputs
  seed: 42

data:
  input_size: 224
  resize_short_side: 256
  metadata:
    enabled: true
    age_column: age
    sex_column: sex
    localization_column: localization
    age_scale: 100.0
    include_missing_indicators: true
    sex_values: [male, female, unknown]
    localization_values:
      - abdomen
      - acral
      - back
      - chest
      - ear
      - face
      - foot
      - genital
      - hand
      - lower extremity
      - neck
      - scalp
      - trunk
      - unknown
      - upper extremity
  mask_aux:
    enabled: true
    image_dir: data/raw/ISIC_masks/images
    mask_dir: data/raw/ISIC_masks/masks
    batch_size: 32
    num_workers: 0

train:
  epochs: 80
  batch_size: 48
  num_workers: 8
  lr: 0.0003
  backbone_lr: 0.00003
  adapter_lr: 0.0003
  head_lr: 0.0003
  weight_decay: 0.05
  warmup_epochs: 5
  early_stopping_patience: 15
  selection_metric: macro_f1
  selection_tie_breaker: mel_auc

loss:
  name: weighted_ce
  multitask: true
  beta: 0.999
  lambda_7class: 1.0
  lambda_melanoma: 0.5
  lambda_mask_aux: 0.1
  lambda_consistency: 0.05
  lambda_sparse: 0.0005
  lambda_tv: 0.002

eval:
  bootstrap_iters: 1000
  ece_bins: 15
  threshold_source: validation
  calibration:
    min_temperature: 0.5
    max_temperature: 5.0

model:
  name: oncoderm_mambax_b6_full
  source: oncoderm_mambax
  timm_name: convnext_tiny
  pretrained: true
  num_classes: 7
  out_indices: [1, 2, 3]
  fusion_dim: 768
  multi_scale_fusion: true
  dropout: 0.1
  cssa:
    enabled: true
    stage3_enabled: true
    adapter_dim: 256
    scan_kernel_size: 7
  lesion_prior:
    enabled: true
  metadata_fusion:
    enabled: true
    hidden_dim: 64
  heads:
    melanoma_endpoint: true
