project:
  name: lesionmamba_v03
  output_dir: outputs
  seed: 42
  split_seed: 42
data:
  dataset: HAM10000
  metadata_csv: data/raw/HAM10000/HAM10000_metadata.csv
  image_dir: data/raw/HAM10000/images
  split_dir: splits
  input_size: 224
  resize_short_side: 256
  num_classes: 7
  label_column: dx
  image_id_column: image_id
  group_column: lesion_id
  patient_id_column: patient_id
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    stratify: dx
    group_policy: lesion_id_first_patient_id_if_complete
    group_priority:
    - lesion_id
    - patient_id
  transforms:
    random_resized_crop_scale:
    - 0.8
    - 1.0
    hflip_p: 0.5
    vflip_p: 0.5
    rotation_degrees: 30
    color_jitter:
    - 0.1
    - 0.1
    - 0.08
    - 0.02
    gaussian_blur_p: 0.05
    random_erasing_p: 0.0
    mixup_alpha: 0.0
    cutmix_alpha: 0.0
  root: data/raw/HAM10000
train:
  epochs: 40
  batch_size: 64
  batch_size_candidates:
  - 64
  - 128
  num_workers: 8
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.05
  warmup_epochs: 3
  scheduler: cosine
  amp: true
  grad_clip: 1.0
  early_stopping_patience: 8
  selection_metric: macro_f1
  selection_tie_breaker: mel_auc
loss:
  name: cb_focal
  beta: 0.999
  gamma: 2.0
  label_smoothing: 0.05
  lambda_sparse: 0.001
  lambda_tv: 0.005
eval:
  bootstrap_iters: 1000
  bootstrap_min_iters_if_time_limited: 500
  ece_bins: 15
  threshold_source: validation
  save_logits: true
  save_val_predictions: true
  save_test_predictions: true
  save_attention: true
  report_ci_metrics:
  - macro_f1
  - macro_auc
  - mel_auc
  - sensitivity
  - specificity
model:
  name: swin_tiny
  source: timm
  timm_name: swin_tiny_patch4_window7_224
  pretrained: true
  num_classes: 7
  allow_random_init_fallback: false
