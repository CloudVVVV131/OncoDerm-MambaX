[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoderm-mambax"
version = "0.3.0"
description = "Research software for skin-lesion classification and melanoma evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<3", "torchvision>=0.21,<1", "timm>=1.0.27,<1.1",
  "numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.7,<2",
  "Pillow>=11,<13", "PyYAML>=6,<7", "tqdm>=4.66,<5",
  "matplotlib>=3.10,<4", "seaborn>=0.13,<0.14", "einops>=0.8,<1",
  "thop==0.1.1.post2209072238", "remotezip==0.12.3"
]

[project.urls]
Repository = "https://github.com/CloudVVVV131/OncoDerm-MambaX"
Issues = "https://github.com/CloudVVVV131/OncoDerm-MambaX/issues"

[tool.setuptools.packages.find]
include = ["lesionmamba*"]
